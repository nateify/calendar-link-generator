<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Event Link Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-weight: normal;
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
            color: #333;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            display: block;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-primary {
            width: 100%;
            margin-top: 16px;
            background: #0066cc;
        }

        .btn-primary:hover {
            background: #0052a3;
        }

        .btn-gcal {
            background: #4285f4;
        }

        .btn-gcal:hover {
            background: #3367d6;
        }

        .btn-ics {
            background: #2e7d32;
        }

        .btn-ics:hover {
            background: #1b5e20;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background: #f4f4f4;
            border-radius: 4px;
            word-break: break-all;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div id="form-container">
        <h2>Create Calendar Event Link</h2>
        <form id="event-form">
            <label for="title">Title *</label>
            <input type="text" id="title" required>

            <label for="location">Location</label>
            <input type="text" id="location">

            <label for="start">Start Time *</label>
            <input type="datetime-local" id="start" required>

            <label for="end">End Time *</label>
            <input type="datetime-local" id="end" required>

            <button type="submit" class="btn btn-primary">Generate Shareable Link</button>
        </form>

        <div id="result" class="hidden">
            <strong>Shareable Link:</strong>
            <input type="text" id="output-url" readonly onclick="this.select()">
        </div>
    </div>

    <div id="download-container" class="hidden">
        <h2 id="event-heading">Calendar Event</h2>
        <p id="event-meta" style="color: #666; font-size: 0.95rem;"></p>

        <div class="button-group">
            <a id="gcal-link" class="btn btn-gcal" target="_blank" rel="noopener noreferrer">
                + Add to Google Calendar
            </a>
            <a id="ics-link" class="btn btn-ics">
                📅 Add to Calendar App
            </a>
        </div>
    </div>

    <script>
        function toBase64Url(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, (b) => String.fromCharCode(b)).join('');
            return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function fromBase64Url(base64url) {
            let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            const binString = atob(base64);
            const bytes = Uint8Array.from(binString, (c) => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function escapeIcsText(str) {
            return (str || '')
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\n/g, '\\n');
        }

        function formatIcsDateTime(epochSec, timeZone) {
            const date = new Date(epochSec * 1000);
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const parts = Object.fromEntries(formatter.formatToParts(date).map(p => [p.type, p.value]));
            const hour = parts.hour === '24' ? '00' : parts.hour;
            return `${parts.year}${parts.month}${parts.day}T${hour}${parts.minute}${parts.second}`;
        }

        function buildIcsFile(title, location, startSec, endSec, tz) {
            const nowUtc = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
            const uid = `${Date.now()}-${Math.random().toString(36).substring(2, 9)}@eventlink`;
            const startFormatted = formatIcsDateTime(startSec, tz);
            const endFormatted = formatIcsDateTime(endSec, tz);

            return [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Calendar//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                'BEGIN:VEVENT',
                `UID:${uid}`,
                `DTSTAMP:${nowUtc}`,
                `DTSTART;TZID=${tz}:${startFormatted}`,
                `DTEND;TZID=${tz}:${endFormatted}`,
                `SUMMARY:${escapeIcsText(title)}`,
                (location ? [`LOCATION:${escapeIcsText(location)}`] : []),
                'STATUS:CONFIRMED',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');
        }

        function buildGoogleCalendarUrl(title, location, startSec, endSec, tz) {
            const formatUtc = (sec) => new Date(sec * 1000).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: title,
                dates: `${formatUtc(startSec)}/${formatUtc(endSec)}`,
                ctz: tz
            });
            if (location) params.set('location', location);

            return `https://calendar.google.com/calendar/render?${params.toString()}`;
        }

        const hash = window.location.hash.substring(1);

        if (hash) {
            try {
                const [title, location, startB36, endB36, tz] = JSON.parse(fromBase64Url(hash));
                const startSec = parseInt(startB36, 36);
                const endSec = parseInt(endB36, 36);

                document.getElementById('form-container').classList.add('hidden');
                document.getElementById('download-container').classList.remove('hidden');
                document.getElementById('event-heading').textContent = title;
                document.getElementById('event-meta').textContent = location ? `📍 ${location}` : ``;

                const gcalUrl = buildGoogleCalendarUrl(title, location, startSec, endSec, tz);
                document.getElementById('gcal-link').href = gcalUrl;

                const icsContent = buildIcsFile(title, location, startSec, endSec, tz);
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const blobUrl = URL.createObjectURL(blob);
                const filename = `${title.replace(/[^a-z0-9]/gi, '_') || 'event'}.ics`;

                const icsButton = document.getElementById('ics-link');
                icsButton.href = blobUrl;
                icsButton.download = filename;
            } catch (err) {
                alert('Invalid or corrupted calendar link.');
                window.location.hash = '';
                window.location.reload();
            }
        } else {
            const form = document.getElementById('event-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const title = document.getElementById('title').value;
                const location = document.getElementById('location').value;
                const startVal = document.getElementById('start').value;
                const endVal = document.getElementById('end').value;

                // Compress timestamps to Base36
                const startSecB36 = Math.floor(new Date(startVal).getTime() / 1000).toString(36);
                const endSecB36 = Math.floor(new Date(endVal).getTime() / 1000).toString(36);
                const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

                const payload = [title, location, startSecB36, endSecB36, userTz];
                const encoded = toBase64Url(JSON.stringify(payload));
                const fullUrl = `${window.location.origin}${window.location.pathname}#${encoded}`;

                const resultDiv = document.getElementById('result');
                const outputUrl = document.getElementById('output-url');

                outputUrl.value = fullUrl;
                resultDiv.classList.remove('hidden');
                outputUrl.select();
            });
        }
    </script>
</body>

</html>
